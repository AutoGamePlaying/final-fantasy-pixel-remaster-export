name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Configure Git line endings and .NET cache paths
        shell: bash
        run: |
          git config --global core.autocrlf false
          {
            echo "DOTNET_CLI_HOME=${RUNNER_TEMP}/dotnet-home"
            echo "NUGET_PACKAGES=${RUNNER_TEMP}/nuget"
            echo "NUGET_HTTP_CACHE_PATH=${RUNNER_TEMP}/nuget-http"
            echo "AGP_HOME=${RUNNER_TEMP}/agp-home"
          } >> "${GITHUB_ENV}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nuget
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Run check script
        shell: bash
        run: |
          if [[ -e .deps ]]; then
            echo "错误：CI 工作区中不应存在 .deps 目录" >&2
            exit 1
          fi
          bash scripts/check.sh

      - name: Smoke test Windows GUI binary
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          $guiExe = Join-Path $PWD "src\FfprExport.Gui\bin\Release\net10.0-windows\ffpr-export-gui.exe"
          if (-not (Test-Path -LiteralPath $guiExe -PathType Leaf)) {
            throw "错误：未找到构建出的窗口程序：$guiExe"
          }
          $stdoutFile = Join-Path $env:RUNNER_TEMP "gui-selftest-build.stdout.txt"
          $stderrFile = Join-Path $env:RUNNER_TEMP "gui-selftest-build.stderr.txt"
          try {
            # WinExe (GUI subsystem): wait explicitly with Start-Process and redirect stdio so logs and errors are visible.
            $selfTest = Start-Process `
              -FilePath $guiExe `
              -ArgumentList @('--self-test') `
              -RedirectStandardOutput $stdoutFile `
              -RedirectStandardError $stderrFile `
              -Wait `
              -PassThru `
              -NoNewWindow
            if (Test-Path -LiteralPath $stdoutFile -PathType Leaf) {
              $outText = [System.IO.File]::ReadAllText($stdoutFile, $utf8NoBom).Trim()
              if (-not [string]::IsNullOrWhiteSpace($outText)) {
                Write-Host $outText
              }
            }
            if (Test-Path -LiteralPath $stderrFile -PathType Leaf) {
              $errText = [System.IO.File]::ReadAllText($stderrFile, $utf8NoBom).Trim()
              if (-not [string]::IsNullOrWhiteSpace($errText)) {
                [Console]::Error.WriteLine($errText)
              }
            }
            $selfTestExit = $selfTest.ExitCode
            if ($selfTestExit -ne 0) {
              throw "错误：ffpr-export-gui.exe --self-test 失败（退出码 $selfTestExit）"
            }
          } finally {
            Remove-Item -LiteralPath $stdoutFile, $stderrFile -Force -ErrorAction SilentlyContinue
          }

  fixture-hash:
    name: Fixture Hash (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Configure Git line endings and .NET cache paths
        shell: bash
        run: |
          git config --global core.autocrlf false
          {
            echo "DOTNET_CLI_HOME=${RUNNER_TEMP}/dotnet-home"
            echo "NUGET_PACKAGES=${RUNNER_TEMP}/nuget"
            echo "NUGET_HTTP_CACHE_PATH=${RUNNER_TEMP}/nuget-http"
            echo "AGP_HOME=${RUNNER_TEMP}/agp-home"
          } >> "${GITHUB_ENV}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nuget
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build fixture database and compute hash
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          bash scripts/fixture-db.sh --hash-out "${RUNNER_TEMP}/fixture-hash-${MATRIX_OS}.json"

      - name: Run synthetic export and collect file hashes
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          bash scripts/fixture-export.sh --manifest-out "${RUNNER_TEMP}/fixture-export-${MATRIX_OS}.json"

      - name: Upload fixture hash report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-hash-${{ matrix.os }}
          path: ${{ runner.temp }}/fixture-hash-${{ matrix.os }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload fixture export hash manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-export-${{ matrix.os }}
          path: ${{ runner.temp }}/fixture-export-${{ matrix.os }}.json
          if-no-files-found: error
          retention-days: 7

  compare-hash:
    name: Compare Cross-Platform Hashes
    needs: fixture-hash
    runs-on: ubuntu-latest
    steps:
      - name: Download fixture hash reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fixture-hash-*
          path: ${{ runner.temp }}/hashes
          merge-multiple: true

      - name: Download fixture export hash manifests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fixture-export-*
          path: ${{ runner.temp }}/export-hashes
          merge-multiple: true

      - name: Compare Linux and Windows database hashes
        shell: bash
        run: |
          python3 - "${RUNNER_TEMP}/hashes/fixture-hash-ubuntu-latest.json" "${RUNNER_TEMP}/hashes/fixture-hash-windows-latest.json" <<'PY'
          import json
          import sys

          linux_path, win_path = sys.argv[1], sys.argv[2]
          with open(linux_path, "r", encoding="utf-8") as f:
              linux_data = json.load(f)
          with open(win_path, "r", encoding="utf-8") as f:
              win_data = json.load(f)

          print(f"Linux   file_sha256:    {linux_data['file_sha256']}")
          print(f"Windows file_sha256:    {win_data['file_sha256']}")
          print(f"Linux   content_sha256: {linux_data['content_sha256']}")
          print(f"Windows content_sha256: {win_data['content_sha256']}")
          print(f"Linux   sqlite_version: {linux_data.get('sqlite_version')} (schema v{linux_data.get('schema_version')})")
          print(f"Windows sqlite_version: {win_data.get('sqlite_version')} (schema v{win_data.get('schema_version')})")

          diffs = []
          for field in ("file_sha256", "content_sha256", "schema_version"):
              if linux_data.get(field) != win_data.get(field):
                  diffs.append(f"字段 {field} 不一致：Linux={linux_data.get(field)} vs Windows={win_data.get(field)}")

          linux_tables = {t["name"]: t for t in linux_data.get("tables", [])}
          win_tables = {t["name"]: t for t in win_data.get("tables", [])}
          all_names = sorted(set(linux_tables) | set(win_tables))

          diff_tables = []
          for name in all_names:
              lt = linux_tables.get(name)
              wt = win_tables.get(name)
              if lt is None:
                  diff_tables.append(f"  - {name}: Linux 缺失，Windows rows={wt['rows']} sha256={wt['sha256']}")
              elif wt is None:
                  diff_tables.append(f"  - {name}: Windows 缺失，Linux rows={lt['rows']} sha256={lt['sha256']}")
              elif lt["rows"] != wt["rows"] or lt["sha256"] != wt["sha256"]:
                  diff_tables.append(
                      f"  - {name}: Linux(rows={lt['rows']}, sha256={lt['sha256']}) != "
                      f"Windows(rows={wt['rows']}, sha256={wt['sha256']})"
                  )

          if diffs or diff_tables:
              print("错误：Linux 与 Windows 构建的假数据库哈希不一致！", file=sys.stderr)
              for line in diffs:
                  print(line, file=sys.stderr)
              if diff_tables:
                  print(f"存在差异的表（共 {len(diff_tables)} 张）：", file=sys.stderr)
                  for line in diff_tables:
                      print(line, file=sys.stderr)
              sys.exit(1)

          print(f"核对通过：Linux 与 Windows 哈希完全一致（共 {len(all_names)} 张表）。")
          PY

      - name: Compare Linux and Windows export file hashes
        shell: bash
        run: |
          python3 - "${RUNNER_TEMP}/export-hashes/fixture-export-ubuntu-latest.json" "${RUNNER_TEMP}/export-hashes/fixture-export-windows-latest.json" <<'PY'
          import json
          import sys

          linux_path, win_path = sys.argv[1], sys.argv[2]
          with open(linux_path, "r", encoding="utf-8") as f:
              linux_data = json.load(f)
          with open(win_path, "r", encoding="utf-8") as f:
              win_data = json.load(f)

          linux_files = {item["path"]: item for item in linux_data.get("files", [])}
          win_files = {item["path"]: item for item in win_data.get("files", [])}
          all_paths = sorted(set(linux_files) | set(win_files))

          if not all_paths:
              print("错误：合成导出哈希清单为空！", file=sys.stderr)
              sys.exit(1)

          diff_files = []
          for rel_path in all_paths:
              lf = linux_files.get(rel_path)
              wf = win_files.get(rel_path)
              if lf is None:
                  diff_files.append(f"  - {rel_path}: Linux 缺失，Windows(size={wf['size']}, sha256={wf['sha256']})")
              elif wf is None:
                  diff_files.append(f"  - {rel_path}: Windows 缺失，Linux(size={lf['size']}, sha256={lf['sha256']})")
              elif lf["sha256"] != wf["sha256"] or lf["size"] != wf["size"]:
                  diff_files.append(
                      f"  - {rel_path}: Linux(size={lf['size']}, sha256={lf['sha256']}) != "
                      f"Windows(size={wf['size']}, sha256={wf['sha256']})"
                  )
              elif lf.get("has_cr") or wf.get("has_cr") or lf.get("has_bom") or wf.get("has_bom"):
                  diff_files.append(
                      f"  - {rel_path}: 检测到 CR 或 BOM（Linux cr={lf.get('has_cr')}/bom={lf.get('has_bom')}, "
                      f"Windows cr={wf.get('has_cr')}/bom={wf.get('has_bom')}）"
                  )

          if diff_files:
              print("错误：Linux 与 Windows 合成导出文件哈希不一致！", file=sys.stderr)
              print(f"存在差异的文件（共 {len(diff_files)} 个）：", file=sys.stderr)
              for line in diff_files:
                  print(line, file=sys.stderr)
              sys.exit(1)

          print(f"核对通过：Linux 与 Windows 合成导出文件哈希完全一致（共 {len(all_paths)} 个文件）。")
          PY

  package-windows:
    name: Package Windows (win-x64)
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Configure Git line endings and .NET cache paths
        shell: bash
        run: |
          git config --global core.autocrlf false
          {
            echo "DOTNET_CLI_HOME=${RUNNER_TEMP}/dotnet-home"
            echo "NUGET_PACKAGES=${RUNNER_TEMP}/nuget"
            echo "NUGET_HTTP_CACHE_PATH=${RUNNER_TEMP}/nuget-http"
            echo "AGP_HOME=${RUNNER_TEMP}/agp-home"
          } >> "${GITHUB_ENV}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve package version and short commit SHA
        shell: bash
        run: |
          if [[ -e .deps ]]; then
            echo "错误：CI 工作区中不应存在 .deps 目录" >&2
            exit 1
          fi
          if [[ ! -f VERSION ]]; then
            echo "错误：仓库根目录缺少 VERSION 文件" >&2
            exit 1
          fi
          PACKAGE_VERSION="$(tr -d '[:space:]' < VERSION)"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          if [[ -z "$PACKAGE_VERSION" || -z "$SHORT_SHA" ]]; then
            echo "错误：无法解析版本号或提交短号" >&2
            exit 1
          fi
          {
            echo "PACKAGE_VERSION=${PACKAGE_VERSION}"
            echo "SHORT_SHA=${SHORT_SHA}"
          } >> "${GITHUB_ENV}"
          echo "==> 打包目标：ffpr-export-${PACKAGE_VERSION}-${SHORT_SHA}-win-x64"

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nuget
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Package Windows native build
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version "$env:PACKAGE_VERSION"

      - name: Verify Windows package contents and GUI self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zipPath = Join-Path $PWD "dist\ffpr-export-$($env:PACKAGE_VERSION)-win-x64.zip"
          $verifyDir = Join-Path $env:RUNNER_TEMP "verify-win-pkg"
          if (Test-Path -LiteralPath $verifyDir) {
            Remove-Item -LiteralPath $verifyDir -Recurse -Force
          }
          Expand-Archive -LiteralPath $zipPath -DestinationPath $verifyDir -Force
          Write-Host "==> 解压后的压缩包内容："
          Get-ChildItem -LiteralPath $verifyDir -File | Sort-Object Name | Format-Table Name, Length -AutoSize
          foreach ($name in @("ffpr-export-gui.exe", "ffpr-export.exe", "e_sqlite3.dll", "known-builds.json", "SHA256SUMS", "README.md", "LICENSE", "使用说明.txt")) {
            $itemPath = Join-Path $verifyDir $name
            if (-not (Test-Path -LiteralPath $itemPath -PathType Leaf)) {
              throw "错误：压缩包缺少文件：$name"
            }
          }
          $packagedGui = Join-Path $verifyDir "ffpr-export-gui.exe"
          $packagedCli = Join-Path $verifyDir "ffpr-export.exe"
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)

          function Invoke-PackagedExe {
            param(
              [string]$ExePath,
              [string[]]$ExeArgs,
              [hashtable]$EnvOverrides = @{}
            )
            $psi = [System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName = $ExePath
            $psi.WorkingDirectory = $verifyDir
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $psi.StandardOutputEncoding = $utf8NoBom
            $psi.StandardErrorEncoding = $utf8NoBom
            foreach ($a in $ExeArgs) {
              [void]$psi.ArgumentList.Add($a)
            }
            foreach ($kv in $EnvOverrides.GetEnumerator()) {
              $psi.Environment[[string]$kv.Key] = [string]$kv.Value
            }
            $p = [System.Diagnostics.Process]::Start($psi)
            if ($null -eq $p) {
              throw "错误：无法启动 $ExePath"
            }
            try {
              $errTask = $p.StandardError.ReadToEndAsync()
              $outText = $p.StandardOutput.ReadToEnd().Trim()
              $errText = $errTask.GetAwaiter().GetResult().Trim()
              $p.WaitForExit()
              if (-not [string]::IsNullOrWhiteSpace($outText)) {
                Write-Host $outText
              }
              if (-not [string]::IsNullOrWhiteSpace($errText)) {
                [Console]::Error.WriteLine($errText)
              }
              return [pscustomobject]@{
                ExitCode = $p.ExitCode
                Stdout   = $outText
                Stderr   = $errText
              }
            } finally {
              $p.Dispose()
            }
          }

          Write-Host "==> 常规打包自检：ffpr-export-gui.exe --self-test --require-cli"
          $normalSelfTest = Invoke-PackagedExe -ExePath $packagedGui -ExeArgs @("--self-test", "--require-cli")
          if ($normalSelfTest.ExitCode -ne 0) {
            throw "错误：打包后的 ffpr-export-gui.exe --self-test --require-cli 失败（退出码 $($normalSelfTest.ExitCode)）"
          }

          Write-Host "==> 模拟 TEMP 不可写（TEMP/TMP 指向阻塞文件）自检"
          $blockedTemp = Join-Path $env:RUNNER_TEMP "ci-blocked-temp-file"
          $noTempAgpHome = Join-Path $env:RUNNER_TEMP "agp-home-notemp-ci"
          $noTempFixtureDir = Join-Path $env:RUNNER_TEMP "fixture-notemp-ci"
          $noTempFixtureDb = Join-Path $env:RUNNER_TEMP "fixture-notemp-ci.sqlite"
          try {
            if (Test-Path -LiteralPath $noTempFixtureDir) { Remove-Item -LiteralPath $noTempFixtureDir -Recurse -Force }
            if (Test-Path -LiteralPath $noTempFixtureDb) { Remove-Item -LiteralPath $noTempFixtureDb -Force }
            [System.IO.File]::WriteAllText($blockedTemp, "blocked-temp`n", $utf8NoBom)
            $blockedEnv = @{
              "TEMP"     = $blockedTemp
              "TMP"      = $blockedTemp
              "AGP_HOME" = $noTempAgpHome
            }

            $guiNoTemp = Invoke-PackagedExe -ExePath $packagedGui -ExeArgs @("--self-test", "--require-cli") -EnvOverrides $blockedEnv
            if ($guiNoTemp.ExitCode -ne 0) {
              throw "错误：TEMP 不可写模拟下 ffpr-export-gui.exe --self-test --require-cli 失败（退出码 $($guiNoTemp.ExitCode)）"
            }

            $cliHelpNoTemp = Invoke-PackagedExe -ExePath $packagedCli -ExeArgs @("--help") -EnvOverrides $blockedEnv
            if ($cliHelpNoTemp.ExitCode -ne 0 -or -not $cliHelpNoTemp.Stdout.Contains("ffpr-export")) {
              throw "错误：TEMP 不可写模拟下 ffpr-export.exe --help 失败（退出码 $($cliHelpNoTemp.ExitCode)）"
            }

            $fixtureWrite = Invoke-PackagedExe -ExePath $packagedCli -ExeArgs @("db", "write-fixture", "--out", $noTempFixtureDir) -EnvOverrides $blockedEnv
            if ($fixtureWrite.ExitCode -ne 0) {
              throw "错误：TEMP 不可写模拟下 ffpr-export.exe db write-fixture 失败（退出码 $($fixtureWrite.ExitCode)）"
            }

            $fixtureBuild = Invoke-PackagedExe -ExePath $packagedCli -ExeArgs @("db", "build", "--export", $noTempFixtureDir, "--out", $noTempFixtureDb) -EnvOverrides $blockedEnv
            if ($fixtureBuild.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $noTempFixtureDb -PathType Leaf)) {
              throw "错误：TEMP 不可写模拟下 ffpr-export.exe db build（加载 e_sqlite3.dll）失败（退出码 $($fixtureBuild.ExitCode)）"
            }
          } finally {
            Remove-Item -LiteralPath $blockedTemp, $noTempFixtureDb, "$noTempFixtureDb.manifest.json" -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $noTempFixtureDir, $noTempAgpHome -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffpr-export-${{ env.PACKAGE_VERSION }}-${{ env.SHORT_SHA }}-win-x64
          path: dist/ffpr-export-${{ env.PACKAGE_VERSION }}-win-x64.zip
          if-no-files-found: error
          retention-days: 30
