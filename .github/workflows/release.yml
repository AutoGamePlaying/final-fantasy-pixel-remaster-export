name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    name: Build and Release (win-x64)
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Configure Git line endings and .NET cache paths
        shell: bash
        run: |
          git config --global core.autocrlf false
          {
            echo "DOTNET_CLI_HOME=${RUNNER_TEMP}/dotnet-home"
            echo "NUGET_PACKAGES=${RUNNER_TEMP}/nuget"
            echo "NUGET_HTTP_CACHE_PATH=${RUNNER_TEMP}/nuget-http"
            echo "AGP_HOME=${RUNNER_TEMP}/agp-home"
          } >> "${GITHUB_ENV}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches VERSION file
        shell: bash
        run: |
          if [[ ! -f VERSION ]]; then
            echo "错误：仓库根目录缺少 VERSION 文件" >&2
            exit 1
          fi
          TAG_NAME="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG_NAME#v}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ -z "$TAG_VERSION" || "$TAG_VERSION" != "$FILE_VERSION" ]]; then
            echo "错误：tag 版本（${TAG_NAME} -> ${TAG_VERSION}）与 VERSION 文件（${FILE_VERSION}）不一致" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${FILE_VERSION}" >> "${GITHUB_ENV}"
          echo "==> 版本校验通过：${TAG_NAME}（VERSION=${FILE_VERSION}）"

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nuget
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Run check script
        shell: bash
        run: |
          if [[ -e .deps ]]; then
            echo "错误：发布工作区中不应存在 .deps 目录" >&2
            exit 1
          fi
          bash scripts/check.sh

      - name: Package Windows native release
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version "$env:RELEASE_VERSION"

      - name: Verify packaged zip and GUI self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zipPath = Join-Path $PWD "dist\ffpr-export-$($env:RELEASE_VERSION)-win-x64.zip"
          $verifyDir = Join-Path $env:RUNNER_TEMP "verify-release-pkg"
          if (Test-Path -LiteralPath $verifyDir) {
            Remove-Item -LiteralPath $verifyDir -Recurse -Force
          }
          Expand-Archive -LiteralPath $zipPath -DestinationPath $verifyDir -Force
          foreach ($name in @("ffpr-export-gui.exe", "ffpr-export.exe", "known-builds.json", "SHA256SUMS", "README.md", "LICENSE", "使用说明.txt")) {
            $itemPath = Join-Path $verifyDir $name
            if (-not (Test-Path -LiteralPath $itemPath -PathType Leaf)) {
              throw "错误：发布压缩包缺少文件：$name"
            }
          }
          $packagedGui = Join-Path $verifyDir "ffpr-export-gui.exe"
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          $stdoutFile = Join-Path $env:RUNNER_TEMP "gui-selftest-release.stdout.txt"
          $stderrFile = Join-Path $env:RUNNER_TEMP "gui-selftest-release.stderr.txt"
          try {
            # WinExe (GUI subsystem): wait explicitly with Start-Process and redirect stdio so logs and errors are visible.
            $selfTest = Start-Process `
              -FilePath $packagedGui `
              -ArgumentList @('--self-test', '--require-cli') `
              -WorkingDirectory $verifyDir `
              -RedirectStandardOutput $stdoutFile `
              -RedirectStandardError $stderrFile `
              -Wait `
              -PassThru `
              -NoNewWindow
            if (Test-Path -LiteralPath $stdoutFile -PathType Leaf) {
              $outText = [System.IO.File]::ReadAllText($stdoutFile, $utf8NoBom).Trim()
              if (-not [string]::IsNullOrWhiteSpace($outText)) {
                Write-Host $outText
              }
            }
            if (Test-Path -LiteralPath $stderrFile -PathType Leaf) {
              $errText = [System.IO.File]::ReadAllText($stderrFile, $utf8NoBom).Trim()
              if (-not [string]::IsNullOrWhiteSpace($errText)) {
                [Console]::Error.WriteLine($errText)
              }
            }
            $selfTestExit = $selfTest.ExitCode
            if ($selfTestExit -ne 0) {
              throw "错误：发布包中的 ffpr-export-gui.exe --self-test --require-cli 失败（退出码 $selfTestExit）"
            }
          } finally {
            Remove-Item -LiteralPath $stdoutFile, $stderrFile -Force -ErrorAction SilentlyContinue
          }

      - name: Prepare Release notes
        shell: bash
        run: |
          ZIP_NAME="ffpr-export-${RELEASE_VERSION}-win-x64.zip"
          for required in "dist/${ZIP_NAME}" "dist/SHA256SUMS" "dist/known-builds.json"; do
            if [[ ! -f "$required" ]]; then
              echo "错误：缺少发布产物：$required" >&2
              exit 1
            fi
          done

          cat > "${RUNNER_TEMP}/release-notes.md" <<EOF
          ## 说明

          - 本发布包**不含任何游戏数据**（仅包含图形界面工具、命令行导出与建库工具、校验文件与已知构建清单）。
          - 同时支持《FINAL FANTASY I–VI Pixel Remaster》全六作（FF1–6），工具会自动识别游戏编号、Unity 版本与 Steam 构建号。
          - 构建完成后，工具会自动将生成的数据库与 \`known-builds.json\` 中的已知构建记录进行哈希比对。

          ## 快速使用（Windows）

          1. 下载 \`${ZIP_NAME}\` 并用 \`SHA256SUMS\` 校验完整性后**完整解压**；
          2. 双击运行 \`ffpr-export-gui.exe\`，程序会自动扫描并默认勾选本机 Steam 中的 FF1–FF6；
          3. 点击 **“开始导出”** 即可依次导出并在 \`%LOCALAPPDATA%\\agp\\ffpr-export\\output\\<游戏代号>-<构建号>\\\` 中生成 SQLite 数据库。

          命令行用法也可直接在同一解压目录运行：

          \`\`\`powershell
          ffpr-export build-db --game "<Steam 游戏目录>"
          \`\`\`

          ## 附件

          - \`${ZIP_NAME}\`：Windows x64 原生单文件版 \`ffpr-export-gui.exe\`（图形界面）、\`ffpr-export.exe\`（命令行/向导）、\`使用说明.txt\`、\`known-builds.json\`、\`SHA256SUMS\`、\`README.md\`、\`LICENSE\`
          - \`SHA256SUMS\`：发布附件的 SHA-256 校验值
          - \`known-builds.json\`：FF1–6 已登记的游戏版本与数据库哈希清单
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          fail_on_unmatched_files: true
          token: ${{ github.token }}
          files: |
            dist/ffpr-export-${{ env.RELEASE_VERSION }}-win-x64.zip
            dist/SHA256SUMS
            dist/known-builds.json
