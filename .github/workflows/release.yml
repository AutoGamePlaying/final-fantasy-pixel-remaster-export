name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    name: Build and Release (win-x64)
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Configure Git line endings and .NET cache paths
        shell: bash
        run: |
          git config --global core.autocrlf false
          {
            echo "DOTNET_CLI_HOME=${RUNNER_TEMP}/dotnet-home"
            echo "NUGET_PACKAGES=${RUNNER_TEMP}/nuget"
            echo "NUGET_HTTP_CACHE_PATH=${RUNNER_TEMP}/nuget-http"
            echo "AGP_HOME=${RUNNER_TEMP}/agp-home"
          } >> "${GITHUB_ENV}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches VERSION file
        shell: bash
        run: |
          if [[ ! -f VERSION ]]; then
            echo "Error: Missing VERSION file in repository root" >&2
            exit 1
          fi
          TAG_NAME="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG_NAME#v}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ -z "$TAG_VERSION" || "$TAG_VERSION" != "$FILE_VERSION" ]]; then
            echo "Error: Tag version (${TAG_NAME} -> ${TAG_VERSION}) does not match VERSION file (${FILE_VERSION})" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${FILE_VERSION}" >> "${GITHUB_ENV}"
          echo "==> Version check passed: ${TAG_NAME} (VERSION=${FILE_VERSION})"

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nuget
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Run check script
        shell: bash
        run: |
          if [[ -e .deps ]]; then
            echo "Error: .deps directory must not exist in release workspace" >&2
            exit 1
          fi
          bash scripts/check.sh

      - name: Package Windows native release
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version "$env:RELEASE_VERSION"

      - name: Verify packaged zip and GUI self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zipPath = Join-Path $PWD "dist\ffpr-export-$($env:RELEASE_VERSION)-win-x64.zip"
          $verifyDir = Join-Path $env:RUNNER_TEMP "verify-release-pkg"
          if (Test-Path -LiteralPath $verifyDir) {
            Remove-Item -LiteralPath $verifyDir -Recurse -Force
          }
          Expand-Archive -LiteralPath $zipPath -DestinationPath $verifyDir -Force
          Write-Host "==> Extracted release archive contents:"
          Get-ChildItem -LiteralPath $verifyDir -File | Sort-Object Name | Format-Table Name, Length -AutoSize
          foreach ($name in @("ffpr-export-gui.exe", "ffpr-export.exe", "e_sqlite3.dll", "known-builds.json", "SHA256SUMS", "README.md", "LICENSE", "README-Windows.txt")) {
            $itemPath = Join-Path $verifyDir $name
            if (-not (Test-Path -LiteralPath $itemPath -PathType Leaf)) {
              throw "Error: Release archive is missing file: $name"
            }
          }
          $packagedGui = Join-Path $verifyDir "ffpr-export-gui.exe"
          $packagedCli = Join-Path $verifyDir "ffpr-export.exe"
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)

          function Invoke-PackagedExe {
            param(
              [string]$ExePath,
              [string[]]$ExeArgs,
              [hashtable]$EnvOverrides = @{}
            )
            $psi = [System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName = $ExePath
            $psi.WorkingDirectory = $verifyDir
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $psi.StandardOutputEncoding = $utf8NoBom
            $psi.StandardErrorEncoding = $utf8NoBom
            foreach ($a in $ExeArgs) {
              [void]$psi.ArgumentList.Add($a)
            }
            foreach ($kv in $EnvOverrides.GetEnumerator()) {
              $psi.Environment[[string]$kv.Key] = [string]$kv.Value
            }
            $p = [System.Diagnostics.Process]::Start($psi)
            if ($null -eq $p) {
              throw "Error: Failed to start process: $ExePath"
            }
            try {
              $errTask = $p.StandardError.ReadToEndAsync()
              $outText = $p.StandardOutput.ReadToEnd().Trim()
              $errText = $errTask.GetAwaiter().GetResult().Trim()
              $p.WaitForExit()
              if (-not [string]::IsNullOrWhiteSpace($outText)) {
                Write-Host $outText
              }
              if (-not [string]::IsNullOrWhiteSpace($errText)) {
                [Console]::Error.WriteLine($errText)
              }
              return [pscustomobject]@{
                ExitCode = $p.ExitCode
                Stdout   = $outText
                Stderr   = $errText
              }
            } finally {
              $p.Dispose()
            }
          }

          Write-Host "==> Standard release package self-test: ffpr-export-gui.exe --self-test --require-cli"
          $normalSelfTest = Invoke-PackagedExe -ExePath $packagedGui -ExeArgs @("--self-test", "--require-cli")
          if ($normalSelfTest.ExitCode -ne 0) {
            throw "Error: Release ffpr-export-gui.exe --self-test --require-cli failed (exit code $($normalSelfTest.ExitCode))"
          }

          Write-Host "==> Verifying single-file localization resources (en, zh-Hans, ja)"
          foreach ($langCheck in @(
            @{ Code = "en"; Marker = "Usage:" },
            @{ Code = "zh-Hans"; Marker = "用法：" },
            @{ Code = "ja"; Marker = "使い方：" }
          )) {
            $cliLang = Invoke-PackagedExe -ExePath $packagedCli -ExeArgs @("--lang", $langCheck.Code, "--help")
            if ($cliLang.ExitCode -ne 0 -or -not $cliLang.Stdout.Contains($langCheck.Marker)) {
              throw "Error: Release ffpr-export.exe --lang $($langCheck.Code) --help failed (exit code $($cliLang.ExitCode))"
            }
            $guiLang = Invoke-PackagedExe -ExePath $packagedGui -ExeArgs @("--lang", $langCheck.Code, "--self-test", "--require-cli")
            if ($guiLang.ExitCode -ne 0) {
              throw "Error: Release ffpr-export-gui.exe --lang $($langCheck.Code) --self-test --require-cli failed (exit code $($guiLang.ExitCode))"
            }
          }

          Write-Host "==> Simulating unwritable TEMP (TEMP/TMP pointing to a regular file)"
          $blockedTemp = Join-Path $env:RUNNER_TEMP "release-blocked-temp-file"
          $noTempAgpHome = Join-Path $env:RUNNER_TEMP "agp-home-notemp-release"
          $noTempFixtureDir = Join-Path $env:RUNNER_TEMP "fixture-notemp-release"
          $noTempFixtureDb = Join-Path $env:RUNNER_TEMP "fixture-notemp-release.sqlite"
          try {
            if (Test-Path -LiteralPath $noTempFixtureDir) { Remove-Item -LiteralPath $noTempFixtureDir -Recurse -Force }
            if (Test-Path -LiteralPath $noTempFixtureDb) { Remove-Item -LiteralPath $noTempFixtureDb -Force }
            [System.IO.File]::WriteAllText($blockedTemp, "blocked-temp`n", $utf8NoBom)
            $blockedEnv = @{
              "TEMP"     = $blockedTemp
              "TMP"      = $blockedTemp
              "AGP_HOME" = $noTempAgpHome
            }

            $guiNoTemp = Invoke-PackagedExe -ExePath $packagedGui -ExeArgs @("--self-test", "--require-cli") -EnvOverrides $blockedEnv
            if ($guiNoTemp.ExitCode -ne 0) {
              throw "Error: Release ffpr-export-gui.exe --self-test --require-cli failed under blocked TEMP (exit code $($guiNoTemp.ExitCode))"
            }

            $cliHelpNoTemp = Invoke-PackagedExe -ExePath $packagedCli -ExeArgs @("--help") -EnvOverrides $blockedEnv
            if ($cliHelpNoTemp.ExitCode -ne 0 -or -not $cliHelpNoTemp.Stdout.Contains("ffpr-export")) {
              throw "Error: Release ffpr-export.exe --help failed under blocked TEMP (exit code $($cliHelpNoTemp.ExitCode))"
            }

            $fixtureWrite = Invoke-PackagedExe -ExePath $packagedCli -ExeArgs @("db", "write-fixture", "--out", $noTempFixtureDir) -EnvOverrides $blockedEnv
            if ($fixtureWrite.ExitCode -ne 0) {
              throw "Error: Release ffpr-export.exe db write-fixture failed under blocked TEMP (exit code $($fixtureWrite.ExitCode))"
            }

            $fixtureBuild = Invoke-PackagedExe -ExePath $packagedCli -ExeArgs @("db", "build", "--export", $noTempFixtureDir, "--out", $noTempFixtureDb) -EnvOverrides $blockedEnv
            if ($fixtureBuild.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $noTempFixtureDb -PathType Leaf)) {
              throw "Error: Release ffpr-export.exe db build (loading e_sqlite3.dll) failed under blocked TEMP (exit code $($fixtureBuild.ExitCode))"
            }
          } finally {
            Remove-Item -LiteralPath $blockedTemp, $noTempFixtureDb, "$noTempFixtureDb.manifest.json" -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $noTempFixtureDir, $noTempAgpHome -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Prepare Release notes
        shell: bash
        run: |
          ZIP_NAME="ffpr-export-${RELEASE_VERSION}-win-x64.zip"
          for required in "dist/${ZIP_NAME}" "dist/SHA256SUMS" "dist/known-builds.json"; do
            if [[ ! -f "$required" ]]; then
              echo "Error: Missing release artifact: $required" >&2
              exit 1
            fi
          done

          cat > "${RUNNER_TEMP}/release-notes.md" <<EOF
          ## Notes

          - This release archive contains **no game files or game data** (only the GUI app, CLI exporter/builder, checksums, and known-builds registry).
          - Supports all six *FINAL FANTASY I–VI Pixel Remaster* titles (FF1–FF6) with automatic game, Unity version, and Steam Build ID detection.
          - Supports English (default), Simplified Chinese (\`zh-Hans\`), and Japanese (\`ja\`) in both the GUI and CLI.
          - Automatically verifies built SQLite database hashes against \`known-builds.json\`.

          ## Quick Start (Windows)

          1. Download \`${ZIP_NAME}\`, verify its SHA-256 against \`SHA256SUMS\`, and **extract the entire archive** to a regular folder.
          2. Double-click \`ffpr-export-gui.exe\`; installed FF1–FF6 games in your Steam libraries are auto-detected and selected by default.
          3. Click **Start Export** to build SQLite databases under \`%LOCALAPPDATA%\\agp\\ffpr-export\\output\\<game>-<buildid>\\\`.

          CLI usage from the same extracted folder:

          \`\`\`powershell
          .\ffpr-export.exe build-db --game "<Steam game directory>"
          \`\`\`

          ## Assets

          - \`${ZIP_NAME}\`: Windows x64 native \`ffpr-export-gui.exe\` (GUI), \`ffpr-export.exe\` (CLI / wizard), \`e_sqlite3.dll\` (sibling SQLite native library; never extracted to TEMP), \`README-Windows.txt\`, \`known-builds.json\`, \`SHA256SUMS\`, \`README.md\`, \`LICENSE\`
          - \`SHA256SUMS\`: SHA-256 checksums for release assets
          - \`known-builds.json\`: Registered FF1–FF6 game versions and database hashes
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          fail_on_unmatched_files: true
          token: ${{ github.token }}
          files: |
            dist/ffpr-export-${{ env.RELEASE_VERSION }}-win-x64.zip
            dist/SHA256SUMS
            dist/known-builds.json
